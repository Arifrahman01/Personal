<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Personal Hub — Pusat produktivitas harian, notulensi rapat AI, jadwal sholat, keuangan, dan brankas terenkripsi.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Personal Hub">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Personal Hub</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --canvas: #F6F7F9;
      --text-primary: #111827;
      --text-secondary: #4B5563;
      --accent: #0D6E66;
      --track: #E5E7EB;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --canvas: #0D1117;
        --text-primary: #F1F5F9;
        --text-secondary: #94A3B8;
        --accent: #2DD4BF;
        --track: #1E2530;
      }
    }
    body {
      background-color: var(--canvas);
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text-primary);
      overflow: hidden;
    }
    #loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 24px;
    }
    .brand-logo {
      border-radius: 22px;
      box-shadow: 0 8px 24px rgba(13, 110, 102, 0.16);
      margin-bottom: 18px;
    }
    .brand-title {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.2px;
      color: var(--text-primary);
    }
    .progress-track {
      width: 140px;
      height: 3px;
      border-radius: 999px;
      background-color: var(--track);
      overflow: hidden;
      margin: 16px 0 12px;
      position: relative;
    }
    .progress-indicator {
      position: absolute;
      top: 0;
      left: 0;
      width: 45%;
      height: 100%;
      border-radius: 999px;
      background-color: var(--accent);
      animation: calm-slide 1.25s ease-in-out infinite;
    }
    @keyframes calm-slide {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(320%); }
    }
    @media (prefers-reduced-motion: reduce) {
      .progress-indicator {
        animation: none;
        width: 100%;
        opacity: 0.7;
      }
    }
    .loading-text {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
    }
  </style>
</head>
<body>
  <div id="loading-container">
    <img src="icons/Icon-192.png" alt="Personal Hub" width="88" height="88" class="brand-logo" />
    <h1 class="brand-title">Personal Hub</h1>
    <div class="progress-track" role="progressbar" aria-label="Memuat Personal Hub">
      <div class="progress-indicator"></div>
    </div>
    <div class="loading-text">Menyiapkan ruang kerja Anda...</div>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
